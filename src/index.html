<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織図作成アプリ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- トップバー -->
        <header class="top-bar">
            <div class="app-title">組織図作成アプリ</div>
            <div class="top-menu">
                <button id="newFileBtn" class="btn btn-secondary">新規</button>
                <button id="openFileBtn" class="btn btn-secondary">開く</button>
                <button id="saveFileBtn" class="btn btn-primary">保存</button>
            </div>
        </header>

        <div class="main-layout">
            <!-- サイドバー -->
            <aside class="sidebar">
                <nav class="nav-menu">
                    <button class="nav-item active" data-view="dashboard">
                        <span class="icon">📊</span>
                        <span>ダッシュボード</span>
                    </button>
                    <button class="nav-item" data-view="employees">
                        <span class="icon">👥</span>
                        <span>社員管理</span>
                    </button>
                    <button class="nav-item" data-view="organizations">
                        <span class="icon">🏢</span>
                        <span>組織管理</span>
                    </button>
                    <button class="nav-item" data-view="orgchart">
                        <span class="icon">🌳</span>
                        <span>組織図表示</span>
                    </button>
                </nav>
            </aside>

            <!-- メインコンテンツ -->
            <main class="main-content">
                <!-- ダッシュボード -->
                <div id="dashboardView" class="view active">
                    <h1>ダッシュボード</h1>
                    <div class="dashboard-cards">
                        <div class="card">
                            <h3>社員数</h3>
                            <div class="stat-number" id="employeeCount">0</div>
                        </div>
                        <div class="card">
                            <h3>組織数</h3>
                            <div class="stat-number" id="orgCount">0</div>
                        </div>
                        <div class="card">
                            <h3>最終更新</h3>
                            <div class="stat-text" id="lastUpdate">未保存</div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <h2>クイックアクション</h2>
                        <button class="btn btn-large" onclick="switchView('employees')">社員を追加</button>
                        <button class="btn btn-large" onclick="switchView('organizations')">組織を追加</button>
                        <button class="btn btn-large btn-success" onclick="switchView('orgchart')">組織図を表示</button>
                    </div>
                </div>

                <!-- 社員管理 -->
                <div id="employeesView" class="view">
                    <div class="view-header">
                        <h1>社員管理</h1>
                        <div class="header-actions">
                            <input type="text" id="employeeSearch" placeholder="社員を検索..." class="search-input">
                            <button id="addEmployeeBtn" class="btn btn-primary">社員を追加</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table id="employeeTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>社員ID</th>
                                    <th>氏名</th>
                                    <th>役職</th>
                                    <th>部署</th>
                                    <th>上司ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="employeeTableBody">
                                <!-- 動的に生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 組織管理 -->
                <div id="organizationsView" class="view">
                    <div class="view-header">
                        <h1>組織管理</h1>
                        <div class="header-actions">
                            <button id="addOrgBtn" class="btn btn-primary">組織を追加</button>
                        </div>
                    </div>
                    <div class="org-tree-container">
                        <div id="orgTree" class="org-tree">
                            <!-- 動的に生成 -->
                        </div>
                    </div>
                </div>

                <!-- 組織図表示 -->
                <div id="orgchartView" class="view">
                    <div class="view-header">
                        <h1>組織図</h1>
                        <div class="header-actions">
                            <button id="zoomInBtn" class="btn btn-secondary">拡大</button>
                            <button id="zoomOutBtn" class="btn btn-secondary">縮小</button>
                            <button id="resetZoomBtn" class="btn btn-secondary">リセット</button>
                            <button id="exportHtmlBtn" class="btn btn-success">HTML出力</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <div id="orgChartCanvas" class="org-chart-canvas">
                            <!-- 組織図をここに描画 -->
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- 社員編集モーダル -->
    <div id="employeeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="employeeModalTitle">社員を追加</h2>
                <button class="close-btn" onclick="closeEmployeeModal()">&times;</button>
            </div>
            <form id="employeeForm" class="modal-form">
                <div class="form-group">
                    <label for="empId">社員ID <span class="required">*</span></label>
                    <input type="text" id="empId" required>
                </div>
                <div class="form-group">
                    <label for="empName">氏名 <span class="required">*</span></label>
                    <input type="text" id="empName" required>
                </div>
                <div class="form-group">
                    <label for="empPosition">役職 <span class="required">*</span></label>
                    <input type="text" id="empPosition" required>
                </div>
                <div class="form-group">
                    <label for="empDepartment">部署 <span class="required">*</span></label>
                    <input type="text" id="empDepartment" required>
                </div>
                <div class="form-group">
                    <label for="empManagerId">上司ID</label>
                    <input type="text" id="empManagerId">
                    <small>空欄の場合はトップ（CEO等）として扱われます</small>
                </div>
                <div class="form-group">
                    <label for="empEmail">メールアドレス</label>
                    <input type="email" id="empEmail">
                </div>
                <div class="form-group">
                    <label for="empPhone">電話番号</label>
                    <input type="tel" id="empPhone">
                </div>
                <div class="form-group">
                    <label for="empNotes">備考</label>
                    <textarea id="empNotes" rows="3"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeEmployeeModal()">キャンセル</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 組織編集モーダル -->
    <div id="orgModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="orgModalTitle">組織を追加</h2>
                <button class="close-btn" onclick="closeOrgModal()">&times;</button>
            </div>
            <form id="orgForm" class="modal-form">
                <div class="form-group">
                    <label for="orgId">組織ID <span class="required">*</span></label>
                    <input type="text" id="orgId" required>
                </div>
                <div class="form-group">
                    <label for="orgName">組織名 <span class="required">*</span></label>
                    <input type="text" id="orgName" required>
                </div>
                <div class="form-group">
                    <label for="orgParentId">親組織ID</label>
                    <input type="text" id="orgParentId">
                    <small>空欄の場合はトップレベル組織として扱われます</small>
                </div>
                <div class="form-group">
                    <label for="orgDescription">説明</label>
                    <textarea id="orgDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label for="orgColor">色</label>
                    <input type="color" id="orgColor" value="#3498db">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeOrgModal()">キャンセル</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 通知トースト -->
    <div id="toast" class="toast"></div>

    <script src="renderer.js"></script>
</body>
</html>
